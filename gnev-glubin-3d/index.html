<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d1c">
  <link rel="icon" href="data:,">
  <title>Гнев глубин · 3D</title>
</head>
<body>
  <main id="game">
    <div id="scene" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header id="game-header" class="top">
      <div class="wordmark"><span class="sigil" aria-hidden="true">♆</span><strong>Гнев глубин</strong></div>
      <div class="status">
        <button id="water-settings-toggle" type="button" data-action="water-settings" aria-controls="game-water-inspector" aria-expanded="false">Визуал</button>
        <span><span id="gold">0</span> др.</span>
        <span>Опыт <span id="xp">0</span></span>
      </div>
    </header>

    <section id="dock" aria-labelledby="dock-name">
      <div class="place"><span class="eyebrow">Угодья Посейдона</span><h1 id="dock-name">Причал</h1><p id="dock-goal"></p></div>
      <button id="dock-shop" class="hotspot" data-action="shop"><span aria-hidden="true"></span> Лавка</button>
      <button id="dock-boat" class="hotspot" data-action="map"><span aria-hidden="true"></span> Лодка</button>
    </section>

    <section id="fishing" aria-labelledby="zone-name" tabindex="-1" hidden>
      <div class="fishing-status">
        <div class="readouts">
          <div class="wrath-status"><label for="wrath">Гнев <span id="wrath-number"></span></label><div class="tide-meter"><progress id="wrath" max="100" value="0"></progress></div><span id="stage"></span></div>
          <div><span>Здоровье</span><strong id="health"></strong></div>
          <div><span>Квота</span><strong id="quota"></strong></div>
        </div>
        <div id="zone-intro" class="zone-intro" hidden>
          <h1 id="zone-name"></h1>
          <p id="zone-description"></p>
        </div>
      </div>
      <div class="water-actions" role="group" aria-label="Действия на воде">
        <button id="bow-button" data-action="bow" aria-pressed="false">Лук <kbd>F</kbd></button>
        <button data-action="hold">Трюм</button>
        <button data-action="offering">Подношение <span id="offerings"></span> <kbd>O</kbd></button>
        <button data-action="return">Вернуться</button>
      </div>
      <div id="attack" role="status" hidden></div>
      <div class="fishing-bottom">
        <p id="notice" role="status"></p>
        <div id="phase" class="phase" aria-live="polite"></div>
        <div id="cast-meter" class="fight" hidden><div><label for="cast-charge">Дальность заброса <span id="cast-distance"></span></label><div class="tide-meter"><progress id="cast-charge" max="1" value="0"></progress></div></div></div>
        <div id="bow-meter" class="fight" hidden><div><label for="bow-draw">Натяжение лука</label><div class="tide-meter"><progress id="bow-draw" max="1" value="0"></progress></div></div></div>
        <div id="timing" class="timing" hidden><div class="tide-timing-range"><span id="timing-band"></span><i id="marker"></i></div></div>
        <div id="fight" class="fight" hidden>
          <div><label for="tension">Натяжение <span id="tension-number"></span></label><div class="tide-meter"><progress id="tension" max="100" value="0"></progress></div></div>
          <div><label for="distance">Леска <span id="distance-number"></span></label><div class="tide-meter"><progress id="distance" value="0"></progress></div></div>
        </div>
      </div>
    </section>

    <aside id="game-water-inspector" aria-labelledby="visual-inspector-title" hidden>
      <div class="visual-inspector-header">
        <h2 id="visual-inspector-title">Инспектор визуала</h2>
        <button type="button" class="water-settings-close" data-action="water-settings" aria-label="Закрыть инспектор">×</button>
      </div>
      <div class="visual-tabs" role="tablist" aria-label="Параметры визуала"></div>
      <div class="visual-scroll">
        <section id="visual-water" role="tabpanel"><div id="game-water-controls"></div></section>
        <section id="visual-light" role="tabpanel" hidden>
          <div class="visual-section">
            <label class="visual-select" for="visual-stage">
              <span>Предпросмотр стадии</span>
              <select id="visual-stage">
                <option value="auto">По игре</option>
                <option value="0">I · Тихая вода</option>
                <option value="1">II · Знамение</option>
                <option value="2">III · Ярость</option>
              </select>
            </label>
            <p class="visual-help">Меняет картинку вылазки. Игровой гнев продолжает расти.</p>
          </div>
          <div class="visual-section">
            <h3>Свет и небо</h3>
            <label class="visual-select" for="visual-sky-tint"><span>Оттенок неба</span><input type="color" id="visual-sky-tint" value="#ffffff"></label>
            <div id="visual-light-fields"></div>
          </div>
        </section>
        <section id="visual-effects" role="tabpanel" hidden>
          <div class="visual-section"><h3>Вода и окружение</h3><div id="visual-effects-fields"></div></div>
          <div class="visual-section"><h3>Игровые сигналы</h3><div id="visual-signal-fields"></div></div>
        </section>
      </div>
      <div class="visual-inspector-footer"><button id="visual-reset" type="button">Сбросить свет и эффекты</button></div>
    </aside>
    <dialog id="menu" aria-labelledby="menu-title"><div id="menu-content"></div></dialog>
    <section id="hold" role="dialog" aria-modal="true" aria-labelledby="hold-title" hidden></section>
    <p id="render-error" role="status" hidden>3D-сцена недоступна. Для её показа нужен WebGL.</p>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
